<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ section_title }} - AdminCore</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-bg: #020617;
            --secondary-bg: #0f172a;
            --sidebar-bg: #0a0f1c;
            --accent-color: #fbbf24;
            --text-color: #f8fafc;
            --glass-border: rgba(255, 255, 255, 0.05);
        }
        body {
            background-color: var(--primary-bg);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            background-image: radial-gradient(circle at top right, rgba(251, 191, 36, 0.05), transparent 40%);
        }
        .main-content {
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .placeholder-card {
            background-color: var(--secondary-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
            padding: 3rem;
            max-width: 600px;
            width: 100%;
        }
        .icon-container {
            width: 100px;
            height: 100px;
            background: rgba(251, 191, 36, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.2);
        }
        .icon-container i {
            font-size: 3rem;
            color: var(--accent-color);
        }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="placeholder-card position-relative overflow-hidden">
            <!-- Decorative gradient -->
            <div class="position-absolute top-0 start-0 w-100 h-100" style="background: linear-gradient(135deg, rgba(251, 191, 36, 0.05), transparent); z-index: 0; pointer-events: none;"></div>
            
            <div class="position-relative z-1">
                <div class="icon-container border border-info border-opacity-25">
                    <i class="bi bi-activity text-info"></i>
                </div>
                
                <h2 class="fw-bold text-white mb-3">{{ section_title }} Overview</h2>
                <p class="text-muted mb-4">You are viewing the details for {{ section_title }}. Advanced operations and real-time syncing are active.</p>
                
                <div class="row g-3 mb-4 text-start">
                    <div class="col-6">
                        <div class="p-3 bg-dark bg-opacity-50 rounded border border-secondary shadow-sm">
                            <h6 class="text-warning mb-1"><i class="bi bi-broadcast"></i> Status</h6>
                            <span class="text-success fw-bold small"><i class="bi bi-circle-fill small me-1"></i>Online & Syncing</span>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="p-3 bg-dark bg-opacity-50 rounded border border-secondary shadow-sm">
                            <h6 class="text-info mb-1"><i class="bi bi-clock-history"></i> Last Update</h6>
                            <span class="text-white fw-bold small">Just now</span>
                        </div>
                    </div>
                </div>
                
                <div class="d-flex justify-content-center gap-3 mt-2">
                    <a href="/dashboard/admin" class="btn btn-outline-warning rounded-pill px-4 fw-bold">
                        <i class="bi bi-arrow-left me-2"></i> Dashboard
                    </a>
                    <button class="btn btn-info text-white rounded-pill px-4 fw-bold shadow-sm" onclick="alert('Synchronizing {{ section_title }} data...');">
                        <i class="bi bi-arrow-repeat me-2"></i> Sync Data
                    </button>
                </div>
            </div>
        </div>
        
        <div class="mt-4 text-center">
            <span class="badge bg-dark border border-secondary text-muted px-4 py-2 rounded-pill shadow-sm">
                AdminCore v2.1 • Logged in as {{ user }}
            </span>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Login - AI E-Commerce</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f1f3f6;
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            width: 850px;
            height: 540px;
            display: flex;
            background: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        .login-left {
            width: 40%;
            background-color: #2874f0;
            color: #fff;
            padding: 40px 33px;
        }
        .login-left h2 {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 16px;
        }
        .login-left p {
            font-size: 18px;
            line-height: 150%;
            color: #dbdbdb;
        }
        .login-left img {
            margin-top: 150px;
        }
        .login-right {
            width: 60%;
            padding: 56px 35px 16px;
            position: relative;
        }
        .form-floating > .form-control {
            border: none;
            border-bottom: 1px solid #e0e0e0;
            border-radius: 0;
            padding-left: 0;
            box-shadow: none;
        }
        .form-floating > .form-control:focus {
            border-bottom: 2px solid #2874f0;
        }
        .form-floating > label {
            padding-left: 0;
            color: #878787!important;
        }
        .btn-flipkart {
            background-color: #fb641b;
            color: #fff;
            border: none;
            padding: 12px;
            font-weight: 500;
            font-size: 15px;
            width: 100%;
            border-radius: 2px;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,.2);
            margin-top: 30px;
        }
        .btn-flipkart:hover {
            background-color: #e65a1a;
            color: #fff;
        }
        .terms {
            font-size: 12px;
            color: #878787;
            margin-top: 30px;
            line-height: 1.5;
        }
        .new-account {
            position: absolute;
            bottom: 40px;
            width: calc(100% - 70px);
            text-align: center;
        }
        .new-account a {
            color: #2874f0;
            font-weight: 500;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <h2>Login</h2>
            <p>Get access to your Orders, Wishlist and Recommendations</p>
            <img src="https://static-assets-web.flixcart.com/fk-p-linchpin-web/fk-cp-zion/img/login_img_c4a81e.png" width="200" alt="Flipkart login image">
        </div>
        <div class="login-right">
            <form action="/login" method="POST">
                <input type="hidden" name="role" value="buyer">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" name="username" id="username" placeholder="Enter Email/Mobile number" required>
                    <label for="username">Enter Email/Mobile number</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" name="password" id="password" placeholder="Enter Password" value="none">
                    <label for="password">Enter Password</label>
                </div>
                <p class="terms">
                    By continuing, you agree to AI E-Commerce's <span class="text-primary">Terms of Use</span> and <span class="text-primary">Privacy Policy</span>.
                </p>
                <button type="submit" class="btn btn-flipkart">Login</button>
            </form>
            <div class="new-account">
                <a href="#">New to AI E-Commerce? Create an account</a>
            </div>
        </div>
    </div>
</body>
</html>
